<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 600" role="img" aria-label="EnvoyMesh 网络架构">
  <title>EnvoyMesh Network</title>
  <desc>主 Envoy 家庭节点、EnvoyGo 移动轻客户端、朋友 Envoy、外部代理与 Obsidian 保险箱。</desc>
  <rect width="830" height="600" fill="#0f172a" rx="12"/>
            <defs>
              <linearGradient id="meshGradientZh" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
                <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3" />
              </linearGradient>
              <filter id="glowZh">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <marker id="arrowheadZh" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
                <polygon points="0 0, 8 2.5, 0 5" fill="#6366f1" />
              </marker>
              <marker id="arrowheadCyanZh" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
                <polygon points="0 0, 8 2.5, 0 5" fill="#06b6d4" />
              </marker>
              <marker id="arrowheadPurpleZh" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
                <polygon points="0 0, 8 2.5, 0 5" fill="#a855f7" />
              </marker>
            </defs>
            
            <g opacity="0.08">
              <circle cx="180" cy="100" r="120" fill="none" stroke="#6366f1" stroke-width="2" />
              <circle cx="770" cy="100" r="120" fill="none" stroke="#a855f7" stroke-width="2" />
              <circle cx="475" cy="500" r="150" fill="none" stroke="#06b6d4" stroke-width="2" />
              <line x1="100" y1="50" x2="850" y2="50" stroke="#6366f1" stroke-width="1" />
              <line x1="150" y1="20" x2="800" y2="80" stroke="#06b6d4" stroke-width="1" />
              <line x1="200" y1="80" x2="750" y2="30" stroke="#a855f7" stroke-width="1" />
            </g>

            <text x="415" y="40" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">EnvoyMesh Network</text>
            <line x1="140" y1="55" x2="690" y2="55" stroke="#334155" stroke-width="2" stroke-dasharray="5,5" />

            <g transform="translate(80, 70)">
              <rect x="0" y="0" width="200" height="440" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#glowZh)" />
              <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#6366f1">主节点</text>
              <text x="100" y="45" text-anchor="middle" font-size="11" fill="#94a3b8">桌面 / 家庭服务器</text>
              <line x1="20" y1="55" x2="180" y2="55" stroke="#334155" stroke-width="1" />
              
              <rect x="25" y="70" width="150" height="50" rx="6" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1" />
              <text x="100" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#818cf8">外交官</text>
              <text x="100" y="108" text-anchor="middle" font-size="9" fill="#94a3b8">网络 / libp2p</text>
              
              <rect x="25" y="135" width="150" height="50" rx="6" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1" />
              <text x="100" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#22d3ee">身份 / 信任</text>
              <text x="100" y="173" text-anchor="middle" font-size="9" fill="#94a3b8">信任策略</text>
              
              <rect x="25" y="200" width="150" height="50" rx="6" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1" />
              <text x="100" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#4ade80">工作流</text>
              <text x="100" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">OpenClaw 智能体</text>
              
              <rect x="25" y="265" width="150" height="50" rx="6" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1" />
              <text x="100" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#fb923c">保险箱 API</text>
              <text x="100" y="303" text-anchor="middle" font-size="9" fill="#94a3b8">知识检索</text>
              
              <rect x="25" y="330" width="150" height="50" rx="6" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1" />
              <text x="100" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">沙盒大脑</text>
              <text x="100" y="368" text-anchor="middle" font-size="9" fill="#94a3b8">本地 LLM / AI</text>
              
              <rect x="25" y="395" width="150" height="35" rx="6" fill="rgba(148,163,184,0.2)" stroke="#64748b" stroke-width="1" />
              <text x="100" y="415" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">审计日志</text>
              
              <line x1="100" y1="120" x2="100" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowheadZh)" class="internal-flow" />
              <line x1="100" y1="185" x2="100" y2="200" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowheadCyanZh)" class="internal-flow-delay" />
              <line x1="100" y1="250" x2="100" y2="265" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowheadZh)" class="internal-flow-delay-2" />
              <line x1="100" y1="315" x2="100" y2="330" stroke="#f97316" stroke-width="2" marker-end="url(#arrowheadZh)" class="internal-flow-delay-3" />
              <line x1="100" y1="380" x2="100" y2="395" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowheadPurpleZh)" class="internal-flow-delay-4" />
            </g>

            <g transform="translate(320, 180)">
              <rect x="0" y="0" width="120" height="280" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#glowZh)" />
              <text x="60" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#06b6d4">EnvoyGo</text>
              <text x="60" y="38" text-anchor="middle" font-size="10" fill="#94a3b8">移动应用</text>
              <line x1="10" y1="45" x2="110" y2="45" stroke="#334155" stroke-width="1" />
              
              <rect x="15" y="58" width="90" height="40" rx="4" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1" />
              <text x="60" y="78" text-anchor="middle" font-size="9" font-weight="600" fill="#22d3ee">身份</text>
              <text x="60" y="92" text-anchor="middle" font-size="8" fill="#94a3b8">Ed25519 密钥</text>
              
              <rect x="15" y="105" width="90" height="40" rx="4" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1" />
              <text x="60" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#818cf8">聊天界面</text>
              <text x="60" y="139" text-anchor="middle" font-size="8" fill="#94a3b8">P2P 消息</text>
              
              <rect x="15" y="152" width="90" height="40" rx="4" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1" />
              <text x="60" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#fb923c">终端</text>
              <text x="60" y="186" text-anchor="middle" font-size="8" fill="#94a3b8">远程访问</text>
              
              <rect x="15" y="199" width="90" height="40" rx="4" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1" />
              <text x="60" y="219" text-anchor="middle" font-size="9" font-weight="600" fill="#4ade80">智能体</text>
              <text x="60" y="233" text-anchor="middle" font-size="8" fill="#94a3b8">智能体控制</text>
              
              <line x1="60" y1="98" x2="60" y2="105" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowheadCyanZh)" class="internal-flow" />
              <line x1="60" y1="145" x2="60" y2="152" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowheadZh)" class="internal-flow-delay" />
              <line x1="60" y1="192" x2="60" y2="199" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowheadZh)" class="internal-flow-delay-2" />
            </g>

            <g transform="translate(480, 70)">
              <rect x="0" y="0" width="200" height="440" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#glowZh)" />
              <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#a855f7">朋友节点</text>
              <text x="100" y="45" text-anchor="middle" font-size="11" fill="#94a3b8">远程对等体</text>
              <line x1="20" y1="55" x2="180" y2="55" stroke="#334155" stroke-width="1" />
              
              <rect x="25" y="70" width="150" height="50" rx="6" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1" />
              <text x="100" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#818cf8">外交官</text>
              <text x="100" y="108" text-anchor="middle" font-size="9" fill="#94a3b8">网络</text>
              
              <rect x="25" y="135" width="150" height="50" rx="6" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1" />
              <text x="100" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#22d3ee">信任</text>
              <text x="100" y="173" text-anchor="middle" font-size="9" fill="#94a3b8">信任策略</text>
              
              <rect x="25" y="200" width="150" height="50" rx="6" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1" />
              <text x="100" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#4ade80">工作流</text>
              <text x="100" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">AI 智能体</text>
              
              <rect x="25" y="265" width="150" height="50" rx="6" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1" />
              <text x="100" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#fb923c">保险箱</text>
              <text x="100" y="303" text-anchor="middle" font-size="9" fill="#94a3b8">知识库</text>
              
              <rect x="25" y="330" width="150" height="50" rx="6" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1" />
              <text x="100" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">大脑</text>
              <text x="100" y="368" text-anchor="middle" font-size="9" fill="#94a3b8">LLM / AI</text>
              
              <rect x="25" y="395" width="150" height="35" rx="6" fill="rgba(148,163,184,0.2)" stroke="#64748b" stroke-width="1" />
              <text x="100" y="415" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">审计日志</text>
              
              <line x1="100" y1="120" x2="100" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowheadZh)" class="internal-flow" />
              <line x1="100" y1="185" x2="100" y2="200" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowheadCyanZh)" class="internal-flow-delay" />
              <line x1="100" y1="250" x2="100" y2="265" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowheadZh)" class="internal-flow-delay-2" />
              <line x1="100" y1="315" x2="100" y2="330" stroke="#f97316" stroke-width="2" marker-end="url(#arrowheadZh)" class="internal-flow-delay-3" />
              <line x1="100" y1="380" x2="100" y2="395" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowheadPurpleZh)" class="internal-flow-delay-4" />
            </g>

            <g transform="translate(80, 520)">
              <text x="100" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">外部智能体</text>
              <line x1="20" y1="22" x2="180" y2="22" stroke="#334155" stroke-width="1" />
              
              <rect x="10" y="30" width="60" height="35" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
              <text x="40" y="50" text-anchor="middle" font-size="9" font-weight="600" fill="#60a5fa">HomeClaw</text>
              
              <rect x="75" y="30" width="60" height="35" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
              <text x="105" y="50" text-anchor="middle" font-size="9" font-weight="600" fill="#a78bfa">Hermes</text>
              
              <rect x="140" y="30" width="60" height="35" rx="4" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
              <text x="170" y="50" text-anchor="middle" font-size="9" font-weight="600" fill="#f472b6">OpenHuman</text>
            </g>

            <g transform="translate(300, 265)">
              <rect x="0" y="0" width="60" height="35" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
              <text x="30" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#a78bfa">Obsidian</text>
            </g>

            <path id="path-primary-envoygo-zh" d="M 280 180 L 320 180" stroke="#6366f1" stroke-width="2" fill="none" stroke-dasharray="6,3" />
            <path id="path-envoygo-friend-zh" d="M 440 220 L 480 220" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="6,3" />
            <path id="path-primary-friend-zh" d="M 280 300 Q 380 350 480 300" stroke="#a855f7" stroke-width="2" fill="none" stroke-dasharray="6,3" />
            
            <path id="path-agents-workflow-zh" d="M 100 520 L 100 440" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-dasharray="4,2" />
            
            <path id="path-obsidian-vault-zh" d="M 0 17.5 L -40 17.5 L -40 280" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="4,2" transform="translate(300, 265)" />

            <text x="300" y="172" text-anchor="middle" font-size="9" fill="#818cf8">签名信封</text>
            <text x="460" y="212" text-anchor="middle" font-size="9" fill="#22d3ee">聊天/媒体</text>
            <text x="380" y="365" text-anchor="middle" font-size="9" fill="#c084fc">知识同步</text>
            <text x="92" y="485" text-anchor="middle" font-size="8" fill="#4ade80" transform="rotate(-90, 92, 485)">智能体 API</text>
            <text x="278" y="280" text-anchor="middle" font-size="8" fill="#a78bfa">保险箱导入</text>

            <circle r="4" fill="#6366f1">
              <animateMotion dur="3s" repeatCount="indefinite" path="M 280 180 L 320 180" />
              <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#06b6d4">
              <animateMotion dur="3.5s" repeatCount="indefinite" path="M 440 220 L 480 220" />
              <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#a855f7">
              <animateMotion dur="5s" repeatCount="indefinite" path="M 280 300 Q 380 350 480 300" />
              <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle r="3" fill="#22c55e">
              <animateMotion dur="4s" repeatCount="indefinite" path="M 100 520 L 100 440" />
              <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
            </circle>

          </svg>
