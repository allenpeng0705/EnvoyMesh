name: envoy_mesh_libp2p
description: >-
  Level-2 EnvoyMesh mobile adapters: shared dart_libp2p host, phone mesh
  session (handlers + relay reserve), WAN/LAN discovery session, and
  MeshEnvelopeTransport over libp2p streams. Depends on envoy_mesh (social-lite)
  and envoy_thin_client (WebSocketLike for home circuit dial). Use with
  envoy_thin_client alone for Level-1 thin-client apps.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  dcid: ^1.0.0
  meta: ^1.12.0
  # dart_libp2p pins `mdns_dart ^2.0.1` → 2.2.1, which fails to compile on
  # Dart 3.13+ (InternetAddress vs InterfaceAddress); 2.2.2 fixes it. The
  # constraint can only be widened once dart_libp2p allows it, so every *pub
  # root* that resolves this package must override it, e.g.
  #   dependency_overrides:
  #     mdns_dart: 2.2.2
  # (see apps/envoygo/pubspec.yaml). Not added here on purpose: dependency
  # overrides are only honoured from the root package, and this package's
  # pubspec.lock is tracked — adding one would desync it for consumers.
  dart_libp2p: ^1.0.1
  dart_libp2p_kad_dht: ^1.2.0
  envoy_mesh:
    path: ../envoy-mesh-dart
  envoy_thin_client:
    path: ../envoy-thin-client-dart

dependency_overrides:
  # The vendored fork. Upstream 1.0.3's yamux `openStream` waits for an ACK that
  # `@chainsafe/libp2p-yamux` only emits on its first write, so the wait is
  # circular and no Dart→JS libp2p stream can open at all. The patch is one hunk;
  # see `../../vendor/dart_libp2p/PATCHES.md` for the semantics, the rejected
  # alternatives and the re-apply-on-bump rule.
  #
  # This deliberately breaks the rule stated above for `mdns_dart`. That rule is
  # about *consumers*: an override here cannot reach them, because overrides are
  # honoured only from the root package. This one is about this package's **own
  # tests** — a wrapper that validates against a different muxer than the one it
  # ships with is testing something nobody runs. `mdns_dart` is still not
  # overridden here, for the reason above; the app roots handle it.
  #
  # Accepted cost: the tracked `pubspec.lock` now records `dart_libp2p` as a path
  # dependency. Pub does not consult a dependency's lock file when resolving its
  # own graph, so consumers are unaffected — only this package's lock moves.
  dart_libp2p:
    path: ../../vendor/dart_libp2p

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
