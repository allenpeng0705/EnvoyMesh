name: envoy_mesh
description: >-
  Pure-Dart EnvoyMesh social-lite SDK: Ed25519 identity/signing, EMP envelopes,
  and an in-process phone mesh social backend. Pair with `envoy_thin_client`
  for home JSON-RPC. Apps can ship thin-client-only, mesh-only, or both.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  dcid: ^1.0.0
  pinenacl: ^0.6.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
