# VENDORED FORK — not a pristine copy of pub.dev's dart_libp2p. EnvoyMesh carries one one-hunk
# patch (the yamux ACK deadlock that blocked every Dart → libp2p-js stream). Read PATCHES.md in this
# directory before refreshing or bumping: re-vendoring means re-applying that patch.
name: dart_libp2p
description: A comprehensive Dart implementation of the libp2p networking stack with modular architecture, multiple transports (TCP/UDX), Noise security, and peer-to-peer capabilities.
version: 1.0.3
homepage: https://github.com/stephanfeb/dart_libp2p
repository: https://github.com/stephanfeb/dart_libp2p
documentation: https://github.com/stephanfeb/dart_libp2p/tree/main/docs
issue_tracker: https://github.com/stephanfeb/dart_libp2p/issues

environment:
  sdk: '^3.5.0'

dependencies:
  protobuf: ^3.1.0
  x25519: ^0.1.1
  cryptography: ^2.7.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  fixnum: ^1.1.0
  uuid: ^4.4.2
  synchronized: ^3.3.0+3
  bs58: ^1.0.2
  dart_multihash: ^1.0.1
  base32: ^2.1.3
  mdns_dart: ^2.0.1

  base_x: ^2.0.0

  dart_udx: ^2.0.3

  dcid: ^1.0.0

  async: ^2.11.0
  meta: ^1.9.1
  collection: ^1.17.1
  logging: ^1.2.0
  convert: ^3.1.0
  args: ^2.7.0
  buffer: ^1.2.3
  stack_trace: ^1.12.1

dev_dependencies:
  dart_libp2p_kad_dht: ^1.2.0
  dart_libp2p_pubsub: ^1.1.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  protoc_builder: ^0.4.1
  test: ^1.24.0
  protoc_plugin: ^21.1.2
  lints: ^2.1.0
