name: ci-smoke-nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke-local-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Full local two-node smoke rehearsal
        run: npm run smoke:local

      - name: Build Social UI (web-content Playwright)
        run: npm run build -w @envoymesh/social -- --mode development

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Phase 45 web-content Playwright smoke
        run: npm run smoke:web-content
