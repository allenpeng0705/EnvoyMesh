name: ci-module-size

on:
  pull_request:
  workflow_dispatch:

jobs:
  module-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Module-size lint (Codex LOC rule)
        run: node scripts/check-module-size.mjs apps/node/src
