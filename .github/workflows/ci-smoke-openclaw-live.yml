name: ci-smoke-openclaw-live

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  openclaw-bridge-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout EnvoyMesh
        uses: actions/checkout@v4

      - name: Checkout OpenClaw
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install EnvoyMesh dependencies
        run: npm install

      - name: Build OpenClaw
        working-directory: openclaw
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Live OpenClaw bridge smoke
        env:
          CI: "true"
          OPENCLAW_BRIDGE_SMOKE_LIVE: "1"
          OPENCLAW_ROOT: ${{ github.workspace }}/openclaw
          ENVOYMESH_OPENCLAW_GATEWAY_START_MS: "180000"
        run: npm run smoke:openclaw-bridge:live
