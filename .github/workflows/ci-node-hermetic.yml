name: ci-node-hermetic

on:
  pull_request:
    paths:
      # The size lint in this job scans every workspace-owned `src` tree — all
      # four app surfaces plus all packages — so a change anywhere under `apps/`
      # or `packages/` must re-run it. This used to enumerate `apps/node/src/**`
      # and a hand-copied subset of five packages, and that subset had already
      # missed `reuse-host`, which the lint scanned. Adding the app trees to the
      # scan list would have widened the same gap to `apps/{cli,relay,social}`:
      # a change there would not have re-run the lint that reads them. Globs that
      # cannot drift from the scan list are the fix; enumerate only to exclude.
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci-node-hermetic.yml"
  workflow_dispatch:

jobs:
  hermetic-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # The harness is a peer, not a dependency of this repo: fail with instructions here
      # rather than with ERR_MODULE_NOT_FOUND from inside a `file:` path mid-test-run.
      - name: Peer dependencies (envoy-harness) resolve
        run: node scripts/check-peer-deps.mjs

      - name: Module-size lint (Codex LOC rule)
        # Same list, verbatim, as `ci-module-size.yml` (which owns the rule and
        # documents why each tree is in or out, and the reason for every allowlist
        # entry added when the package trees joined). Keep the two in step.
        run: node scripts/check-module-size.mjs apps/node/src apps/cli/src apps/relay/src apps/social/src packages/host-connect/src packages/harness/src packages/api/src packages/reuse-host/src packages/node-core/src packages/agent-adapter/src packages/bonds/src packages/identity/src packages/ipfs-helia/src packages/kb-obsidian/src packages/local-store/src packages/mobile-identity/src packages/models/src packages/network/src packages/openclaw-runtime/src packages/protocol/src packages/rag/src packages/vault/src

      # The hermetic lane: deterministic, no-network unit tests
      # covering the envoy-harness integration surface. The full
      # apps/node suite includes live/network tests and is NOT
      # suitable for a per-PR gate; this lane is the fast signal.
      - name: Hermetic integration unit tests
        run: |
          npx vitest run \
            --testTimeout 20000 \
            apps/node/test/user-prompt-router.test.ts \
            apps/node/test/run-owner-agent-turn-routing.test.ts \
            apps/node/test/chain-verify-loop.test.ts \
            apps/node/test/chain-scoreboard.test.ts \
            apps/node/test/chain-graph.test.ts \
            apps/node/test/manifest-openclaw-tags.test.ts \
            apps/node/test/skill-result-formatter.test.ts \
            apps/node/test/b-class-result-formatters.test.ts \
            apps/node/test/node-config-loader.test.ts \
            apps/node/test/node-config-store-v1-4.test.ts \
            apps/node/test/node-service-v1-4.test.ts
