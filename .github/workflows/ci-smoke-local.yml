name: ci-smoke-local

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: OpenClaw bridge two-process smoke
        run: npm run smoke:openclaw-bridge

      - name: Mobile Capacitor production build
        run: npm run build -w @envoymesh/mobile

      - name: Phase 13 two-node smoke (PR signal)
        run: npm run smoke:phase13

      - name: Build Social UI for E2E tests
        run: npm run build -w @envoymesh/social -- --mode development

      - name: Playwright E2E smoke (WebRTC + Social UI)
        run: |
          npx playwright install chromium
          npx vitest run apps/node/test/webrtc-call-e2e.test.ts apps/node/test/social-ui-e2e.test.ts

      - name: Generate smoke artifacts
        run: |
          mkdir -p ci-artifacts
          npm run cli -w @envoymesh/node -- smoke-checklist --output ./ci-artifacts/smoke-checklist.md
          npm run cli -w @envoymesh/node -- pairing timeline --profile ./data/default --format json --output ./ci-artifacts/pairing-timeline.json

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-local-artifacts
          path: ci-artifacts/**
