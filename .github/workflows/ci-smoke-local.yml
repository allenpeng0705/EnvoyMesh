name: ci-smoke-local

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # The orchestrator runs: typecheck → unit → social-build →
      # e2e-fast (libp2p, ~60s) → e2e-playwright (chromium, auto-installs) →
      # smoke (incl. Phase 45 web-content Playwright via 06c).
      # Per-phase logs land in ci-artifacts/test/<phase>.log.
      # See docs/test-orchestrator.md and scripts/test.sh for the full contract.
      - name: "Run test orchestrator (full: typecheck + unit + E2E + smoke)"
        run: npm run test:full

      - name: Mobile Capacitor production build
        run: npm run build -w @envoymesh/mobile

      # Lightweight structural check for the OpenClaw bundle self-reference
      # bug class ("node_modules/openclaw missing → gateway refuses to start").
      # The full spawn+probe smoke (scripts/smoke-openclaw-bundle.sh) is run
      # by tauri-release.yml after scripts/stage-tauri-openclaw-bundle.sh;
      # here we only verify the source tree has the runtime prerequisites so
      # a regression lands as a fast cheap CI failure rather than waiting
      # until a DMG is produced. See commit 66d4a2ea for context.
      - name: OpenClaw bundle self-reference check (lightweight)
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/packages/openclaw"
          test -f "$src/openclaw.mjs" || { echo "✗ missing $src/openclaw.mjs"; exit 1; }
          test -f "$src/package.json" || { echo "✗ missing $src/package.json"; exit 1; }
          test -f "$src/dist/entry.js" || { echo "✗ missing $src/dist/entry.js"; exit 1; }
          test -f "$src/extensions/envoymesh/index.js" || \
            test -f "$src/extensions/envoymesh/index.ts" || { echo "✗ missing envoymesh extension"; exit 1; }
          test -f "$src/dist/config/config.js" || { echo "✗ missing $src/dist/config/config.js"; exit 1; }
          echo "✓ OpenClaw bundle prerequisites present"

      - name: Generate smoke-checklist + pairing timeline artifacts
        run: |
          mkdir -p ci-artifacts
          npm run cli -w @envoymesh/node -- smoke-checklist --output ./ci-artifacts/smoke-checklist.md
          npm run cli -w @envoymesh/node -- pairing timeline --profile ./data/default --format json --output ./ci-artifacts/pairing-timeline.json

      - name: Upload all test/smoke artifacts (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-local-artifacts
          path: ci-artifacts/**
          retention-days: 14
