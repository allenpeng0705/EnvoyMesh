name: ci-smoke-local

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # The orchestrator runs: typecheck → unit → social-build →
      # e2e-fast (libp2p, ~60s) → e2e-playwright (chromium, auto-installs) → smoke.
      # Per-phase logs land in ci-artifacts/test/<phase>.log.
      # See docs/test-orchestrator.md and scripts/test.sh for the full contract.
      - name: Run test orchestrator (full: typecheck + unit + E2E + smoke)
        run: npm run test:full

      - name: Mobile Capacitor production build
        run: npm run build -w @envoymesh/mobile

      - name: Generate smoke-checklist + pairing timeline artifacts
        run: |
          mkdir -p ci-artifacts
          npm run cli -w @envoymesh/node -- smoke-checklist --output ./ci-artifacts/smoke-checklist.md
          npm run cli -w @envoymesh/node -- pairing timeline --profile ./data/default --format json --output ./ci-artifacts/pairing-timeline.json

      - name: Upload all test/smoke artifacts (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-local-artifacts
          path: ci-artifacts/**
          retention-days: 14
