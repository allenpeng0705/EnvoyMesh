<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EnvoyMesh</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="180x180" href="./assets/logo-180.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logo-180.png?v=2" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <script>
      (function(){
        var t = "system";
        try { var s = localStorage.getItem("envoy-theme"); if (s === "light" || s === "dark" || s === "system") t = s; } catch(e) {}
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./design-tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/ui-refine.css" />
    <link rel="stylesheet" href="./styles/chat.css" />
  </head>
  <body>
    <div id="root">
      <div class="app" role="status" aria-live="polite" aria-busy="true">
        <div class="envoy-splash">
          <div class="envoy-splash__backdrop" aria-hidden="true"></div>
          <div class="envoy-splash__card">
            <div class="envoy-splash__mesh" aria-hidden="true"></div>
            <div class="loading-spinner envoy-splash__spinner" aria-hidden="true"></div>
            <h2 class="envoy-splash__title">Starting EnvoyMesh…</h2>
            <p class="envoy-splash__detail">Loading the app and home node. First launch can take 1–2 minutes.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
