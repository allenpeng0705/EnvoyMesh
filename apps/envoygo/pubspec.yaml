name: envoygo
description: EnvoyGo — Flutter thin client for EnvoyMesh remote access
publish_to: 'none'
version: 1.0.0+17

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Transport
  web_socket_channel: ^3.0.2
  # State
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  sqflite: ^2.4.2
  path: ^1.9.1
  # QR scanning (mobile only)
  mobile_scanner: ^6.0.7
  image_picker: ^1.1.2
  # Audio recording (voice messages)
  record: ^5.1.2
  # WebRTC (voice/video calls, Phase 38/42). Phase 42D bumps to ^0.14.0
  # for the API surface used by WebRtcCallTransport.
  flutter_webrtc: ^0.14.0
  # Phase 42I — iOS CallKit integration for backgrounded VoIP calls.
  # flutter_callkit_incoming surfaces the native iOS incoming-call UI
  # when a VoIP push wakes the app from background, and bridges the
  # call answer/decline back into Dart.
  flutter_callkit_incoming: ^2.0.0
  # URI parsing
  uri: ^1.0.0
  # JSON
  json_annotation: ^4.9.0
  # Crypto
  pinenacl: ^0.6.0
  # libp2p (P2P networking — circuit relay, noise, KAD-DHT)
  dart_libp2p: ^1.0.1
  dart_libp2p_pubsub: ^1.1.0
  dart_libp2p_kad_dht: ^1.2.0
  # Compression (gzip decoding for pairing token)
  archive: ^3.6.1
  # Push notifications (mobile only)
  firebase_core: ^3.0.1
  firebase_messaging: ^15.0.1
  # Network connectivity (mobile + desktop)
  connectivity_plus: ^6.0.5
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: any
  url_launcher: ^6.3.1
  # Crypto (contentHash verify for Browser — Phase 45C)
  crypto: ^3.0.3
  # Platform detection
  flutter_web_plugins:
    sdk: flutter
  # WebView for xterm.js terminal
  flutter_inappwebview: ^6.1.5
  # App version / build number (Me screen footer)
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  mockito: ^5.4.4
  # For sqflite on web in tests
  sqflite_common_ffi: ^2.3.4

# Force a record_linux version that's compatible with
# record_platform_interface ^1.6.0. record_linux 0.7.x was published
# before the platform interface added startStream() and the
# hasPermission(request:) named-arg, so building fails with
# "missing implementations for these members" otherwise.
# (See apps/envoygo/pubspec.lock for the locked record_linux 0.7.2.)
dependency_overrides:
  record_linux: ^1.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/terminal.html
    - assets/logo.png
