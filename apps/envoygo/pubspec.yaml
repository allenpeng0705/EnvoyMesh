name: envoygo
description: EnvoyGo — Flutter thin client for EnvoyMesh remote access
publish_to: 'none'
version: 1.2.2+36

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Transport
  web_socket_channel: ^3.0.2
  # State
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Storage — ^10 uses flutter_secure_storage_darwin (SwiftPM-ready).
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  sqflite: ^2.4.2
  path: ^1.9.1
  # QR scanning (mobile only) — v7+ uses Apple Vision (arm64 simulator OK).
  # v6 pulls GoogleMLKit which excludes arm64 sims and breaks Apple Silicon.
  mobile_scanner: ^7.1.0
  image_picker: ^1.1.2
  # Phone file attach for agent chats (any type → home envoy-uploads)
  file_picker: ^8.1.7
  # Audio recording (voice messages) — ^6 uses record_ios (SwiftPM-ready)
  # instead of CocoaPods-only record_darwin.
  record: ^6.2.1
  # Voice-note playback in chat
  audioplayers: ^6.1.0
  # WebRTC (voice/video calls, Phase 38/42).
  # ^1.6.0 removes private RPSystemBroadcastPickerView.buttonPressed:
  # (App Store Guideline 2.5.1 rejection).
  flutter_webrtc: ^1.6.0
  # CallKit / PushKit removed for China App Store review compliance.
  # Audio/video calls run via WebRTC + a standard APNs alert push
  # (the home node's sendApns adds aps.content-available: 1 to wake
  # the app in the background). The in-app call screen handles
  # accept/decline — no system CallKit UI.
  # URI parsing
  uri: ^1.0.0
  # JSON
  json_annotation: ^4.9.0
  # Crypto
  pinenacl: ^0.6.0
  # libp2p (P2P networking — circuit relay, noise, KAD-DHT)
  dart_libp2p: ^1.0.1
  dart_libp2p_pubsub: ^1.1.0
  dart_libp2p_kad_dht: ^1.2.0
  # Compression (gzip decoding for pairing token)
  archive: ^3.6.1
  # Push notifications (mobile only)
  firebase_core: ^3.0.1
  firebase_messaging: ^15.0.1
  # Network connectivity (mobile + desktop)
  connectivity_plus: ^6.0.5
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: any
  url_launcher: ^6.3.1
  # Crypto (contentHash verify for Browser — Phase 45C)
  crypto: ^3.0.3
  # Platform detection
  flutter_web_plugins:
    sdk: flutter
  # WebView for xterm.js terminal.
  # 6.2.0-beta.3 removes NSClassFromString("PGHostedWindow") which Apple
  # flags as a non-public API (Guideline 2.5.1). Stable 6.1.5 still has it.
  flutter_inappwebview: 6.2.0-beta.3
  # App version / build number (Me screen footer)
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  mockito: ^5.4.4
  # For sqflite on web in tests
  sqflite_common_ffi: ^2.3.4

# sqflite_common_ffi (dev) pulls package:sqlite3, whose default build hook
# downloads prebuilt dylibs from GitHub. That often times out (esp. on
# restricted networks) and blocks iOS simulator builds. Production EnvoyGo
# uses sqflite_darwin / Android SQLite — not these downloads. Use the OS
# SQLite instead so the hook skips the network fetch.
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name: sqlite3

flutter:
  # Flutter 3.44 defaults to SwiftPM; keep CocoaPods for EnvoyGo so App Store
  # builds match the prior plugin integration (Firebase/WebRTC pods).
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/terminal.html
    - assets/logo.png
